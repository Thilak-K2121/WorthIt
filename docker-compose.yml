version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: worthit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: worthit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worthit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/worthit"
      ENVIRONMENT: "production"
      DEBUG: "False"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
